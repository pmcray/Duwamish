; SIMH command file: boot MiniVMS on a MicroVAX II (KA630) with 5 MB of
; memory and an RD54 disk.  Run from the vax/ directory:
;	simh/BIN/microvax2 scripts/boot.ini
; Log in with any user name and password.  SHUTDOWN halts the VAX;
; then type QUIT at the sim> prompt.  CTRL/E also returns to sim>.
set cpu 5m
set cpu simhalt
set rq0 rd54
attach rq0 build/TRAVELLER.DSK
load -o build/MINIVMS.BIN 0
deposit psl 041f0000
go 0
