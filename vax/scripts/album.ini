; SIMH command file: log in, render both tracks of A LOST TRAVELLER with
; CDGEN, list the directory and shut down.  Used by "make album".
set cpu 5m
set cpu simhalt
set rq0 rd54
attach rq0 build/TRAVELLER.DSK
load -o build/MINIVMS.BIN 0
deposit psl 041f0000
expect "Username: " send "FREDERICKS\r"; go
expect "Password: " send "TRAVELLER\r"; go
expect "$ " send "DELETE *.CDDA;*\r"; go
expect "$ " send "RUN CDGEN\r"; go
expect "Manuscript: " send "DEPARTURE\r"; go
expect "]: " send "\r"; go
expect "$ " send "RUN CDGEN\r"; go
expect "Manuscript: " send "VISIBILITIES\r"; go
expect "]: " send "\r"; go
expect "$ " send "DIRECTORY\r"; go
expect "$ " send "SHUTDOWN\r"; go
go 0
quit
